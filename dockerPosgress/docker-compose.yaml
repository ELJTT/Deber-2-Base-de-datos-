services:
  postgres_db:
    build: .
    container_name: postgres_local_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yavaliobarrigaseñorvrg-1
      POSTGRES_DB: mi_base_datos
    ports:
      - "5433:5432"  # Puerto 5433 en tu PC mapeado al 5432 del contenedor (evita conflictos)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # Opcional: scripts .sql o .sh iniciales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mi_base_datos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local